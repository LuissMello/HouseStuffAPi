# fly.toml app configuration file generated for housestuffapi on 2026-08-21T03:04:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'housestuffapi'
primary_region = 'iad'

[build]

[env]
  Frontend__Origin = 'https://luissmello.github.io'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/health/live'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
