# fly.toml app configuration file generated for housestuffapi on 2026-08-21T03:04:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'housestuffapi'
primary_region = 'iad'

[build]

[env]
  Frontend__Origin = 'https://luissmello.github.io'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
