services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: housestuff
      POSTGRES_USER: housestuff
      POSTGRES_PASSWORD: housestuff_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housestuff -d housestuff"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - housestuff-postgres:/var/lib/postgresql/data

volumes:
  housestuff-postgres:
